<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 晨报 · 日历档案</title>
<meta name="wb-version" content="2026-11-21-5-audio-podcast">
<style>
  :root{
    --bg:#0b0f1a; --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09); --txt:#e8edf7; --mut:#9aa6bf;
    --accent:#6ea8fe; --hot:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(110,168,254,.12),transparent 60%),
               radial-gradient(900px 500px at 0% 0%,rgba(167,139,250,.10),transparent 55%),
               var(--bg);
    color:var(--txt); line-height:1.6; padding-bottom:48px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(110,168,254,.16),rgba(167,139,250,.10));
    border:1px solid var(--line);border-radius:22px;
    padding:34px 34px;margin:28px 0 18px;}
  .hero .kicker{font-size:13px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
  .hero h1{font-size:clamp(26px,4.5vw,42px);font-weight:800;margin:6px 0 4px;
    background:linear-gradient(90deg,#fff,#bcd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{color:var(--mut);font-size:14px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:rgba(52,211,153,.18);color:#34d399;border:1px solid rgba(52,211,153,.35);margin-left:8px;vertical-align:middle}
  .badge.old{background:rgba(251,191,36,.16);color:#fbbf24;border-color:rgba(251,191,36,.35)}
  .hero .total{display:inline-flex;align-items:baseline;gap:8px;margin-top:16px;
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
  .hero .total b{font-size:30px;font-weight:800;color:#fff}
  .hero .total span{color:var(--mut);font-size:13px}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
  .stat{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.22);
    border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:13px}
  .stat .dot{width:10px;height:10px;border-radius:50%}
  .stat b{font-size:16px;font-weight:700}
  .stat .lbl{color:var(--mut)}

  .cal{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 22px;margin:18px 0 26px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cal-title{font-size:17px;font-weight:800}
  .cal-title small{font-size:12px;color:var(--mut);font-weight:400;margin-left:8px}
  .cal-ctrls{display:flex;align-items:center;gap:8px}
  .cal-ctrls button{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer;transition:.15s}
  .cal-ctrls button:hover{background:rgba(255,255,255,.12)}
  .cal-ctrls .ym{min-width:104px;text-align:center;font-weight:700;font-size:15px}
  .cal-ctrls .today-btn{color:var(--accent);border-color:rgba(110,168,254,.4)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12px;color:var(--mut);padding:4px 0 8px}
  .cal-cell{position:relative;aspect-ratio:1/1;min-height:38px;border-radius:10px;
    border:1px solid transparent;background:rgba(255,255,255,.035);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:.15s;color:var(--txt);padding:0}
  .cal-cell:hover:not(.empty){background:rgba(255,255,255,.12);border-color:var(--line)}
  .cal-cell.empty{background:transparent;cursor:default}
  .cal-cell .d{font-size:14px;font-weight:600;line-height:1}
  .cal-cell.no-data{opacity:.32;cursor:default}
  .cal-cell.has-data{color:#dce6ff}
  .cal-cell.hot{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.45)}
  .cal-cell.hot .d{color:#fbbf24}
  .cal-cell.selected{background:var(--accent);border-color:var(--accent);color:#0b0f1a;
    box-shadow:0 0 0 2px rgba(110,168,254,.3)}
  .cal-cell.selected .d,.cal-cell.selected .hl-dot{color:#0b0f1a}
  .cal-cell .hl-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--hot)}
  .cal-cell.selected .hl-dot{background:#0b0f1a}
  .cal-cell .lead-tip{display:none}
  .cal-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12px;color:var(--mut);align-items:center}
  .cal-legend .li{display:inline-flex;gap:6px;align-items:center}
  .cal-legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  .cal-legend .sw.hot{background:rgba(251,191,36,.55);border:1px solid rgba(251,191,36,.7)}
  .cal-legend .sw.have{background:rgba(255,255,255,.14)}

  .nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:rgba(11,15,26,.82);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;margin:0 0 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .nav a{color:var(--mut);text-decoration:none;font-size:14px;padding:7px 13px;border-radius:10px;
    border:1px solid transparent;transition:.18s;display:inline-flex;gap:7px;align-items:center}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.06);border-color:var(--line)}
  .nav a .cnt{font-size:12px;color:var(--mut);background:rgba(255,255,255,.06);border-radius:8px;padding:1px 7px}
  .nav .refresh{margin-left:auto;color:var(--mut);cursor:pointer;font-size:14px;padding:7px 13px;border-radius:10px;border:1px solid var(--line)}
  .nav .refresh:hover{color:#fff;background:rgba(255,255,255,.06)}
  .section{margin:34px 0 10px;scroll-margin-top:78px}
  .section-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .section-head .bar{width:5px;height:26px;border-radius:3px}
  .section-head h2{font-size:22px;font-weight:800}
  .section-head .sc{color:var(--mut);font-size:14px;border:1px solid var(--line);border-radius:9px;padding:2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    display:flex;flex-direction:column;gap:11px;position:relative;transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .num{font-size:13px;font-weight:800;color:#0b0f1a;background:var(--accent);
    min-width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
  .chip{font-size:12px;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:999px;padding:4px 11px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h3{font-size:17px;font-weight:700;line-height:1.45}
  .card h3 a{color:#dce6ff;text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .sum{font-size:14px;color:var(--mut);flex:1}
  .more{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:5px;width:fit-content}
  .more:hover{text-decoration:underline}
  .card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .listen{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;
    color:#0b0f1a;background:linear-gradient(135deg,#38bdf8,#818cf8);border:none;border-radius:999px;
    padding:7px 13px;transition:transform .15s,box-shadow .15s,opacity .15s;white-space:nowrap}
  .listen:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(56,189,248,.35)}
  .listen:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .listen .ico{font-size:12px}
  .listen.playing{background:linear-gradient(135deg,#fb7185,#f59e0b);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.5)}50%{box-shadow:0 0 0 8px rgba(251,113,133,0)}}
  .lead-card .listen{margin-top:12px}
  .podcast-tip{font-size:12px;color:var(--mut);opacity:.85}
  .audio-bar{position:sticky;bottom:14px;z-index:50;max-width:760px;margin:18px auto 0;
    background:rgba(20,26,44,.97);border:1px solid rgba(56,189,248,.35);border-radius:14px;
    padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
  .audio-bar.show{display:flex}
  .audio-bar .ab-ico{font-size:20px}
  /* 微信/不支持TTS 时的跳出引导遮罩 */
  .guide-mask{position:fixed;inset:0;z-index:200;background:rgba(8,11,20,.9);display:none;
    align-items:center;justify-content:center;padding:24px}
  .guide-mask.show{display:flex}
  .guide-box{background:var(--card);border:1px solid rgba(56,189,248,.35);border-radius:18px;
    padding:26px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .guide-box .g-ico{font-size:42px;margin-bottom:8px}
  .guide-box h3{font-size:18px;margin:0 0 10px;color:#dce6ff}
  .guide-box p{font-size:14px;color:var(--mut);line-height:1.7;margin:0 0 16px}
  .guide-box .g-step{display:inline-block;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);
    border-radius:10px;padding:9px 14px;color:#7dd3fc;font-size:14px;font-weight:700;margin:4px 0}
  .guide-box .g-close{display:block;width:100%;margin-top:18px;background:var(--accent);color:#0b0f1a;
    border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  .audio-bar .ab-info{flex:1;min-width:0}
  .audio-bar .ab-title{font-size:13px;font-weight:700;color:#dce6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .audio-bar .ab-phase{font-size:12px;color:var(--mut);margin-top:2px}
  .audio-bar button{background:var(--accent);color:#0b0f1a;border:none;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .lead-card{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(255,255,255,.03));
    border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:20px 22px;margin:0 0 8px}
  .lead-card .lk{font-size:12px;color:var(--hot);font-weight:700;letter-spacing:.1em}
  .lead-card h3{font-size:19px;font-weight:800;line-height:1.45;margin:6px 0 8px}
  .lead-card h3 a{color:#fff;text-decoration:none}
  .lead-card h3 a:hover{text-decoration:underline}
  .lead-card p{font-size:14px;color:var(--mut)}
  .foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);
    font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  .foot a{color:var(--accent);text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .state{padding:50px 20px;text-align:center;color:var(--mut)}
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);
    border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);
    border-radius:14px;padding:22px;color:#fda4af;max-width:520px;margin:0 auto}
  .err button{margin-top:14px;background:var(--accent);color:#0b0f1a;border:none;padding:9px 18px;border-radius:10px;font-weight:700;cursor:pointer}
  @media (max-width:560px){
    .hero{padding:26px 20px}.wrap{padding:0 14px}.cal{padding:16px 12px}
    .nav a{padding:6px 10px;font-size:13px}
    .cal-cell{min-height:34px}.cal-cell .d{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">AI HOT · 每日晨报档案 <span class="badge" id="dayBadge">实时</span></div>
    <h1 id="heroDate">AI 晨报</h1>
    <div class="sub" id="heroSub"></div>
    <div class="total"><b id="heroTotal">–</b><span>条精选 · 北京时间</span></div>
    <div class="stats" id="heroStats"></div>
  </header>

  <section class="cal">
    <div class="cal-head">
      <div class="cal-title">日历档案 <small id="calRange"></small></div>
      <div class="cal-ctrls">
        <button id="prevM" aria-label="上个月">&#8249;</button>
        <span class="ym" id="ymLabel"></span>
        <button id="nextM" aria-label="下个月">&#8250;</button>
        <button class="today-btn" id="todayBtn">回到今日</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span class="li"><i class="sw hot"></i>重大事件</span>
      <span class="li"><i class="sw have"></i>有日报</span>
      <span class="li">金色圆点 = 当天头条命中重大关键词</span>
      <span class="li" id="calStatus"></span>
    </div>
  </section>

  <nav class="nav" id="nav"></nav>
  <main id="main">
    <div class="state"><div class="spinner"></div>正在加载 AI 晨报…</div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<div class="audio-bar" id="audioBar">
  <span class="ab-ico" id="abIco">🎧</span>
  <div class="ab-info">
    <div class="ab-title" id="abTitle"></div>
    <div class="ab-phase" id="abPhase"></div>
  </div>
  <button id="abStop">停止</button>
</div>

<div class="guide-mask" id="guideMask">
  <div class="guide-box">
    <div class="g-ico">🎧</div>
    <h3>请在新浏览器打开收听</h3>
    <p>微信内置浏览器暂不支持语音播放。请点击右上角</p>
    <div class="g-step">··· → 在浏览器中打开</div>
    <p style="margin-top:14px">打开后即可点击「听播客」收听中英文双语。</p>
    <button class="g-close" id="guideClose">我知道了</button>
  </div>
</div>
<audio id="podAudio" preload="none" style="display:none"></audio>

<script>
(function(){
  "use strict";
  var BASE = "https://aihot.news/api/v1";
  var SECTIONS_META = [
    {key:"ai-models",   label:"模型发布/更新", color:"#38bdf8"},
    {key:"ai-products", label:"产品发布/更新", color:"#a78bfa"},
    {key:"industry",    label:"行业动态",     color:"#fbbf24"},
    {key:"paper",       label:"论文研究",     color:"#34d399"},
    {key:"tip",         label:"技巧与观点",   color:"#fb7185"}
  ];
  // 重大事件关键词评分表：命中即累加权重，达到阈值判定为重大
  var HOT_WORDS = [
    {w:"IPO", s:3},{w:"上市", s:3},{w:"登陆纳斯达克", s:3},{w:"募资", s:2},{w:"融资", s:2},
    {w:"收购", s:2},{w:"发布", s:2},{w:"推出", s:2},{w:"开源", s:2},{w:"突破", s:2},
    {w:"首次", s:2},{w:"创纪录", s:3},{w:"纪录", s:2},{w:"GPT", s:2},{w:"Gemini", s:2},
    {w:"Claude", s:2},{w:"OpenAI", s:2},{w:"Anthropic", s:2},{w:"NVIDIA", s:2},{w:"英伟达", s:2},
    {w:"Google", s:1},{w:"Meta", s:1},{w:"微软", s:1},{w:"Microsoft", s:1},{w:" resignation".trim(), s:2},
    {w:"辞任", s:2},{w:"辞职", s:2},{w:"变动", s:1},{w:"2万亿", s:2},{w:"万亿", s:2}
  ];
  var HOT_THRESHOLD = 5;
  var HISTORY_LIMIT = 180;

  var zhDate=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'});
  var zhWin =new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric'});
  var zhGen =new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  var zhYmd =new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});

  function fmt(s){try{return zhDate.format(new Date(s+'T00:00:00+08:00'));}catch(e){return s;}}
  function fW(s){try{return zhWin.format(new Date(s));}catch(e){return s;}}
  function fG(s){try{return zhGen.format(new Date(s));}catch(e){return s;}}
  function todayYmd(){
    try{
      var parts=zhYmd.formatToParts(new Date()),o={};
      for(var i=0;i<parts.length;i++) o[parts[i].type]=parts[i].value;
      if(o.year&&o.month&&o.day) return o.year+"-"+o.month+"-"+o.day;
    }catch(e){}
    var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+"-"+m+"-"+dd;
  }
  function ymdOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function parseYmd(s){return new Date(s+'T00:00:00+08:00');}
  function cut(t,n){if(!t)return'';var a=[...t];return a.length<=n?t:a.slice(0,n-1).join('')+'\u2026';}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}

  function hotScore(title, para){
    var text=((title||'')+' '+(para||'')).toLowerCase(), score=0;
    HOT_WORDS.forEach(function(x){ if(text.indexOf(x.w.toLowerCase())>=0) score+=x.s; });
    if(/今日安静|无大事|无明显/.test(text)) score=0;
    return score;
  }

  function matchKey(label){
    for(var i=0;i<SECTIONS_META.length;i++) if(SECTIONS_META[i].label===label) return SECTIONS_META[i].key;
    if(label.indexOf("模型")>=0)return"ai-models";
    if(label.indexOf("产品")>=0)return"ai-products";
    if(label.indexOf("行业")>=0)return"industry";
    if(label.indexOf("论文")>=0)return"paper";
    if(label.indexOf("技巧")>=0)return"tip";
    return null;
  }

  function fetchJson(path){
    return fetch(BASE + path, {cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  }

  // ===== 英文原标题映射（近7天 items，链接 -> originalTitle）=====
  var EN_MAP = {};          // aihot item id -> 英文原题
  function itemIdFromUrl(url){
    if(!url) return '';
    var m=String(url).match(/\/items\/([a-z0-9]+)/i);
    return m?m[1]:'';
  }
  async function loadEnTitles(){
    // items 接口仅覆盖近7天，limit 上限 100
    var j=await fetchJson('/items?limit=100');
    if(!j || !j.items) return;
    j.items.forEach(function(it){
      var id=itemIdFromUrl((it.links&&it.links.aihot)||'') || it.id;
      if(id && it.originalTitle) EN_MAP[id]=it.originalTitle;
    });
  }
  function enTitleOf(url){ return EN_MAP[itemIdFromUrl(url)] || ''; }

  // ===== 播客引擎（优先预生成音频，回退 Web Speech TTS）=====
  var POD = { speaking:false, key:null, btn:null, mode:null };
  var AUDIO_MANIFEST = null;   // 当前日期 audio/<date>/manifest.json
  var AUDIO_BASE = 'audio/';   // 相对发行目录
  var AUDIO_DATE = null;
  function showGuide(){ document.getElementById('guideMask').classList.add('show'); }
  function hideGuide(){ document.getElementById('guideMask').classList.remove('show'); }
  function pickVoice(langPrefix){
    if(!('speechSynthesis' in window)) return null;
    var vs=window.speechSynthesis.getVoices()||[];
    var byLang=vs.filter(function(v){return (v.lang||'').toLowerCase().indexOf(langPrefix)===0;});
    return byLang[0]||null;
  }
  async function loadAudioManifest(date){
    AUDIO_MANIFEST=null; AUDIO_DATE=date;
    try{
      var r=await fetch(AUDIO_BASE+date+'/manifest.json',{cache:'no-store'});
      if(r.ok){ AUDIO_MANIFEST=await r.json(); }
    }catch(e){}
  }
  function audioTracksOf(itemKey){
    if(!AUDIO_MANIFEST || !AUDIO_MANIFEST.items) return null;
    var e=AUDIO_MANIFEST.items[itemKey];
    if(!e) return null;
    var tracks=[];
    if(e.zh) tracks.push({url:AUDIO_BASE+AUDIO_DATE+'/'+e.zh, flag:'🇨🇳', label:'中文 · 标题与摘要'});
    if(e.en) tracks.push({url:AUDIO_BASE+AUDIO_DATE+'/'+e.en, flag:'🇬🇧', label:'English · Original headline'});
    return tracks.length?tracks:null;
  }
  function markPlaying(btn, on){ if(btn){ btn.classList.toggle('playing',on); btn.innerHTML=on?'<span class="ico">⏸</span> 播放中':'<span class="ico">▶</span> 听播客'; } }
  function stopPod(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    var a=document.getElementById('podAudio'); try{a.pause();a.currentTime=0;}catch(e){}
    a.onended=null; a.onerror=null;
    POD.speaking=false; POD.key=null; POD.btn=null; POD.mode=null;
    document.getElementById('audioBar').classList.remove('show');
    document.querySelectorAll('.listen.playing').forEach(function(b){ markPlaying(b,false); });
  }
  // 播放预生成音频队列（微信内可用）
  function playAudioQueue(key, btn, title, tracks){
    stopPod();
    POD.speaking=true; POD.key=key; POD.btn=btn; POD.mode='audio';
    markPlaying(btn,true);
    var bar=document.getElementById('audioBar');
    document.getElementById('abTitle').textContent=title;
    bar.classList.add('show');
    var a=document.getElementById('podAudio');
    var i=0;
    function next(){
      if(i>=tracks.length){ stopPod(); return; }
      var t=tracks[i];
      document.getElementById('abIco').textContent=t.flag;
      document.getElementById('abPhase').textContent='('+(i+1)+'/'+tracks.length+') '+t.label;
      a.src=t.url; a.onended=function(){ i++; next(); };
      a.onerror=function(){ i++; next(); };
      var p=a.play();
      if(p && p.catch) p.catch(function(){ /* 自动播放被拦截，用户已点击按钮一般允许 */ });
    }
    next();
  }
  // 回退浏览器 TTS
  function speakQueue(key, btn, title, parts){
    if(!('speechSynthesis' in window)){ showGuide(); return; }
    stopPod();
    POD.speaking=true; POD.key=key; POD.btn=btn; POD.mode='tts';
    markPlaying(btn,true);
    var bar=document.getElementById('audioBar');
    document.getElementById('abTitle').textContent=title;
    bar.classList.add('show');
    var idx=0;
    function next(){
      if(idx>=parts.length){ stopPod(); return; }
      var item=parts[idx];
      document.getElementById('abIco').textContent=item.lang.indexOf('zh')===0?'🇨🇳':'🇬🇧';
      document.getElementById('abPhase').textContent='('+(idx+1)+'/'+parts.length+') '+(item.lang.indexOf('zh')===0?'中文':'English')+' · '+item.label;
      var u=new SpeechSynthesisUtterance(item.text);
      u.lang=item.lang; var voice=pickVoice(item.lang.indexOf('zh')===0?'zh':'en'); if(voice) u.voice=voice;
      u.rate=item.lang.indexOf('zh')===0?1.0:0.92; u.pitch=1.0; u.volume=1.0;
      u.onend=function(){ idx++; next(); }; u.onerror=function(){ idx++; next(); };
      window.speechSynthesis.speak(u);
    }
    next();
  }
  function makePodcast(title, summary, enTitle){
    var parts=[];
    if(title) parts.push({text:title+(summary?'。'+summary:''),lang:'zh-CN',label:'朗读标题与摘要'});
    if(enTitle) parts.push({text:enTitle,lang:'en-US',label:'Original headline'});
    return parts;
  }
  function listenBtn(title, summary, enTitle, itemKey){
    var b=document.createElement('button');
    b.className='listen';
    b.innerHTML='<span class="ico">▶</span> 听播客';
    var tracks=audioTracksOf(itemKey);
    b.title=tracks?('播客音频：'+(tracks.length>1?'中英双语':'中文')):(enTitle?('双语朗读：中文摘要 + 英文原题'):('中文朗读'));
    b.onclick=function(e){
      e.preventDefault(); e.stopPropagation();
      var key=itemKey||(title+'|'+summary);
      if(POD.speaking && POD.key===key){ stopPod(); return; }
      var tr=audioTracksOf(itemKey);
      if(tr){ playAudioQueue(key, b, title, tr); }
      else { speakQueue(key, b, title, makePodcast(title,summary,enTitle)); }
    };
    return b;
  }

  var INDEX = {};          // date -> {date, leadTitle, leadParagraph, score, hot}
  var STATE = {            // 当前 UI 状态
    viewYear:0, viewMonth:0,
    selectedDate:null,
    today:todayYmd()
  };

  async function loadIndex(){
    var idx = await fetchJson('/dailies?limit='+HISTORY_LIMIT);
    if(!idx || !idx.items || !idx.items.length) throw new Error('无法获取日报索引');
    idx.items.forEach(function(it){
      if(!it.date) return;
      var s = hotScore(it.leadTitle, it.leadParagraph);
      INDEX[it.date] = {date:it.date, leadTitle:it.leadTitle||'', leadParagraph:it.leadParagraph||'', score:s, hot:(s>=HOT_THRESHOLD)};
    });
    return idx.items;
  }

  async function getReport(date){
    var j = await fetchJson('/dailies/'+date);
    if(j && j.report) return j.report;
    throw new Error('该日期暂无日报');
  }

  function buildSections(report){
    var buckets={};
    SECTIONS_META.forEach(function(m){buckets[m.key]=[];});
    (report.sections||[]).forEach(function(sec){
      var key=matchKey(sec.label||""); if(!key) return;
      (sec.items||[]).forEach(function(it){
        var links=it.links||{};
        var aihotUrl=links.aihot||'';
        buckets[key].push({title:it.title||"",source:(it.source&&it.source.name)||"未知来源",summary:it.summary||"",url:links.original||aihotUrl,itemId:itemIdFromUrl(aihotUrl),en:enTitleOf(aihotUrl)});
      });
    });
    var ordered=[];
    SECTIONS_META.forEach(function(m){ if(buckets[m.key].length) ordered.push(Object.assign({},m,{items:buckets[m.key]})); });
    return ordered;
  }

  // 头条本身不带 links，从 sections/flashes/highlights 里按标题匹配出真实链接
  function findLeadUrl(report, title){
    if(!title) return '';
    var norm=function(s){return (s||'').replace(/[\s\u3000]/g,'').toLowerCase();};
    var target=norm(title);
    var pools=[];
    (report.sections||[]).forEach(function(s){(s.items||[]).forEach(function(it){pools.push(it);});});
    (report.flashes||[]).forEach(function(it){pools.push(it);});
    (report.highlights||[]).forEach(function(it){pools.push(it);});
    // 1) 标准化后完全相等
    for(var i=0;i<pools.length;i++){
      if(norm(pools[i].title)===target){
        var l=pools[i].links||{}; if(l.original||l.aihot) return l.original||l.aihot;
      }
    }
    // 2) 互相包含（标题可能被截断或带前缀）
    for(var j=0;j<pools.length;j++){
      var t=norm(pools[j].title);
      if(t && (t.indexOf(target)>=0 || target.indexOf(t)>=0) && Math.min(t.length,target.length)/Math.max(t.length,target.length)>0.6){
        var l2=pools[j].links||{}; if(l2.original||l2.aihot) return l2.original||l2.aihot;
      }
    }
    return '';
  }

  function renderCalendar(){
    var grid=document.getElementById('calGrid'); grid.innerHTML='';
    ['一','二','三','四','五','六','日'].forEach(function(d){ grid.appendChild(el('div','cal-dow','周'+d)); });
    var y=STATE.viewYear, m=STATE.viewMonth; // m: 0-11
    document.getElementById('ymLabel').textContent = y+' 年 '+(m+1)+' 月';
    var first=new Date(y,m,1), startDow=(first.getDay()+6)%7; // 周一=0
    var days=new Date(y,m+1,0).getDate();
    for(var i=0;i<startDow;i++) grid.appendChild(el('div','cal-cell empty'));
    for(var d=1;d<=days;d++){
      var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var meta=INDEX[ds];
      var c=el('div','cal-cell');
      c.dataset.date=ds;
      c.appendChild(el('span','d',String(d)));
      if(meta){
        c.classList.add('has-data');
        if(meta.hot){ c.classList.add('hot'); c.appendChild(el('span','hl-dot')); }
        c.title=ds+' · '+(meta.leadTitle||'');
        if(ds===STATE.selectedDate) c.classList.add('selected');
        (function(date){ c.onclick=function(){ selectDate(date); }; })(ds);
      }else{
        c.classList.add('no-data');
        c.title=ds+' · 无日报';
      }
      grid.appendChild(c);
    }
    // 范围标注
    var dates=Object.keys(INDEX).sort();
    if(dates.length) document.getElementById('calRange').textContent='（'+dates[0]+' 起 · 共 '+dates.length+' 天）';
  }

  function moveMonth(delta){
    var d=new Date(STATE.viewYear, STATE.viewMonth+delta, 1);
    STATE.viewYear=d.getFullYear(); STATE.viewMonth=d.getMonth();
    renderCalendar();
  }

  function renderReport(report, date, isToday){
    var sections=buildSections(report);
    var total=sections.reduce(function(s,x){return s+x.items.length;},0);

    document.getElementById('dayBadge').textContent = isToday?'今日实时':'历史回看';
    document.getElementById('dayBadge').className = 'badge'+(isToday?'':' old');
    var shownDate=report.date||date;
    document.getElementById('heroDate').textContent=fmt(shownDate);
    document.getElementById('heroTotal').textContent=total;
    var sub='统计区间：'+fW(report.windowStart)+' – '+fW(report.windowEnd)+'（北京时间）';
    if(report.generatedAt) sub+=' · 日报生成于 '+fG(report.generatedAt);
    if(!isToday) sub+=' · 正在回看历史日报';
    document.getElementById('heroSub').textContent=sub;

    var stats=document.getElementById('heroStats'); stats.innerHTML='';
    sections.forEach(function(s){
      var d=el('div','stat'); var dot=el('span','dot'); dot.style.background=s.color; d.appendChild(dot);
      d.appendChild(el('b',null,String(s.items.length))); d.appendChild(el('span','lbl',s.label)); stats.appendChild(d);
    });

    var nav=document.getElementById('nav'); nav.innerHTML='';
    sections.forEach(function(s){
      var a=document.createElement('a'); a.href='#sec-'+s.key;
      a.appendChild(el('span',null,s.label)); a.appendChild(el('span','cnt',String(s.items.length))); nav.appendChild(a);
    });
    var refresh=el('a','refresh','刷新'); refresh.href='#';
    refresh.onclick=function(e){e.preventDefault();selectDate(STATE.selectedDate,true);}; nav.appendChild(refresh);

    var main=document.getElementById('main'); main.innerHTML='';
    if(report.lead && report.lead.title){
      var lc=el('div','lead-card');
      lc.appendChild(el('div','lk','今日头条'));
      var h3=el('h3'); var la=document.createElement('a');
      la.textContent=report.lead.title;
      var lurl=(report.lead.links&&(report.lead.links.original||report.lead.links.aihot))||findLeadUrl(report, report.lead.title);
      if(lurl){ la.href=lurl; la.target='_blank'; la.rel='noopener noreferrer'; }
      else { la.href='#'; la.onclick=function(e){e.preventDefault();}; la.style.cursor='default'; la.title='暂无原文链接'; }
      h3.appendChild(la); lc.appendChild(h3);
      var leadPara=report.lead.leadParagraph||'';
      if(leadPara) lc.appendChild(el('p',null,cut(leadPara,120)));
      var leadEn=enTitleOf(lurl);
      var leadListen=listenBtn(report.lead.title, leadPara, leadEn, 'lead');
      lc.appendChild(leadListen);
      main.appendChild(lc);
    }
    var n=0;
    sections.forEach(function(s){
      var sec=el('section','section'); sec.id='sec-'+s.key;
      var head=el('div','section-head'); var bar=el('span','bar'); bar.style.background=s.color; head.appendChild(bar);
      head.appendChild(el('h2',null,s.label)); head.appendChild(el('span','sc',s.items.length+' 条')); sec.appendChild(head);
      var grid=el('div','grid');
      s.items.forEach(function(it){
        n++;
        var card=el('div','card'); card.style.borderTop='3px solid '+s.color;
        var ct=el('div','top'); ct.appendChild(el('span','num',String(n))); ct.appendChild(el('span','chip',it.source)); card.appendChild(ct);
        var h=el('h3'); var lk=document.createElement('a'); lk.textContent=it.title; lk.href=it.url||'#';
        lk.target='_blank'; lk.rel='noopener noreferrer'; h.appendChild(lk); card.appendChild(h);
        card.appendChild(el('p','sum',cut(it.summary,60)));
        var actions=el('div','card-actions');
        var mr=el('a','more','阅读全文 →'); mr.href=it.url||'#'; mr.target='_blank'; mr.rel='noopener noreferrer';
        actions.appendChild(mr);
        actions.appendChild(listenBtn(it.title, it.summary, it.en, it.itemId));
        card.appendChild(actions);
        grid.appendChild(card);
      });
      sec.appendChild(grid); main.appendChild(sec);
    });

    var foot=document.getElementById('foot'); foot.innerHTML='';
    foot.appendChild(el('span',null,'共 '+total+' 条'));
    var src=(report.attribution&&report.attribution.name)||'AI HOT';
    var surl=(report.links&&report.links.aihot);
    if(surl){ var a=document.createElement('a'); a.href=surl; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent='数据来源：'+src+'（aihot.news）'; foot.appendChild(a); }
    else foot.appendChild(el('span',null,'数据来源：'+src));
  }

  function showMainLoading(msg){
    document.getElementById('main').innerHTML='<div class="state"><div class="spinner"></div>'+(msg||'加载中…')+'</div>';
  }
  function showError(msg){
    var main=document.getElementById('main'); main.innerHTML='';
    var box=el('div','err'); box.appendChild(el('div',null,msg));
    var btn=document.createElement('button'); btn.textContent='重试'; btn.onclick=function(){ selectDate(STATE.selectedDate,true); };
    box.appendChild(btn); main.appendChild(box);
  }

  async function selectDate(date, force){
    stopPod();
    STATE.selectedDate=date;
    var d=parseYmd(date);
    STATE.viewYear=d.getFullYear(); STATE.viewMonth=d.getMonth();
    renderCalendar();
    showMainLoading('正在加载 '+date+' 的日报…');
    try{
      var report=await getReport(date);
      await loadAudioManifest(report.date||date);   // 音频清单就绪后再渲染按钮
      renderReport(report, date, (date===STATE.today));
    }catch(e){
      showError('加载失败：'+(e&&e.message?e.message:e));
    }
  }

  document.getElementById('prevM').onclick=function(){moveMonth(-1);};
  document.getElementById('nextM').onclick=function(){moveMonth(1);};
  document.getElementById('todayBtn').onclick=function(){ selectDate(STATE.today); };
  document.getElementById('abStop').onclick=function(){ stopPod(); };
  document.getElementById('guideClose').onclick=function(){ hideGuide(); };
  document.getElementById('guideMask').onclick=function(e){ if(e.target===this) hideGuide(); };
  window.addEventListener('beforeunload', function(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); });

  async function init(){
    document.getElementById('calStatus').textContent='正在载入历史索引…';
    showMainLoading('正在加载 AI 晨报档案…');
    // 英文原题映射与索引并行加载，不阻塞主流程
    var enPromise=loadEnTitles().catch(function(){});
    try{
      await loadIndex();
      await enPromise;
      document.getElementById('calStatus').textContent='已载入 '+Object.keys(INDEX).length+' 天档案';
      // 默认今日；今日无数据则回退到索引里最近的一天
      var target=STATE.today;
      if(!INDEX[target]){
        var dates=Object.keys(INDEX).sort();
        target=dates[dates.length-1]||STATE.today;
      }
      await selectDate(target);
    }catch(e){
      document.getElementById('calStatus').textContent='索引载入失败';
      showError('初始化失败：'+(e&&e.message?e.message:e));
    }
  }

  init();
})();
</script>
