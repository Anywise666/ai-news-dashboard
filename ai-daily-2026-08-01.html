<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 晨报仪表盘</title>
<style>
  :root{
    --bg:#0b0f1a; --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09); --txt:#e8edf7; --mut:#9aa6bf;
    --accent:#6ea8fe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(110,168,254,.12),transparent 60%),
               radial-gradient(900px 500px at 0% 0%,rgba(167,139,250,.10),transparent 55%),
               var(--bg);
    color:var(--txt); line-height:1.6; padding-bottom:48px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(110,168,254,.16),rgba(167,139,250,.10));
    border:1px solid var(--line);border-radius:22px;
    padding:38px 34px;margin:28px 0 18px;}
  .hero .kicker{font-size:13px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
  .hero h1{font-size:clamp(26px,4.5vw,44px);font-weight:800;margin:6px 0 4px;
    background:linear-gradient(90deg,#fff,#bcd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{color:var(--mut);font-size:15px}
  .hero .total{display:inline-flex;align-items:baseline;gap:8px;margin-top:18px;
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
  .hero .total b{font-size:34px;font-weight:800;color:#fff}
  .hero .total span{color:var(--mut);font-size:14px}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
  .stat{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.22);
    border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px}
  .stat .dot{width:10px;height:10px;border-radius:50%}
  .stat b{font-size:17px;font-weight:700}
  .stat .lbl{color:var(--mut)}
  .nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:rgba(11,15,26,.82);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;margin:18px 0 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .nav a{color:var(--mut);text-decoration:none;font-size:14px;padding:7px 13px;border-radius:10px;
    border:1px solid transparent;transition:.18s;display:inline-flex;gap:7px;align-items:center}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.06);border-color:var(--line)}
  .nav a .cnt{font-size:12px;color:var(--mut);background:rgba(255,255,255,.06);
    border-radius:8px;padding:1px 7px}
  .nav .top{margin-left:auto;color:var(--mut)}
  .section{margin:34px 0 10px;scroll-margin-top:78px}
  .section-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .section-head .bar{width:5px;height:26px;border-radius:3px}
  .section-head h2{font-size:22px;font-weight:800}
  .section-head .sc{color:var(--mut);font-size:14px;border:1px solid var(--line);
    border-radius:9px;padding:2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    display:flex;flex-direction:column;gap:11px;position:relative;
    transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);
    box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .num{font-size:13px;font-weight:800;color:#0b0f1a;background:var(--accent);
    min-width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;
    justify-content:center;padding:0 8px}
  .chip{font-size:12px;color:var(--mut);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px;
    max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h3{font-size:17px;font-weight:700;line-height:1.45}
  .card h3 a{color:#dce6ff;text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .sum{font-size:14px;color:var(--mut);flex:1}
  .more{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
    display:inline-flex;align-items:center;gap:5px;width:fit-content}
  .more:hover{text-decoration:underline}
  .foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  .foot a{color:var(--accent);text-decoration:none}
  .foot a:hover{text-decoration:underline}
  @media (max-width:560px){.hero{padding:28px 20px}.wrap{padding:0 14px}
    .nav a{padding:6px 10px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">AI HOT · 每日晨报</div>
    <h1 id="heroDate">AI 晨报</h1>
    <div class="sub" id="heroSub"></div>
    <div class="total"><b id="heroTotal">0</b><span>条今日精选 · 北京时间</span></div>
    <div class="stats" id="heroStats"></div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
