name: AI晨报双语播客每日更新

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = 北京时间 08:30
  workflow_dispatch:       # 保留手动触发入口，方便验证 / 补跑

permissions:
  contents: write          # GITHUB_TOKEN 需写权限才能推回仓库

concurrency:
  group: podcast-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install edge-tts

      - name: 计算北京时间日期
        id: dt
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 幂等检查 - 当天是否已完成
        id: chk
        run: |
          D="${{ steps.dt.outputs.today }}"
          if [ -f "audio/$D/manifest.json" ] && python -c "
          import json,sys
          d=json.load(open('audio/$D/manifest.json',encoding='utf-8'))
          items=d.get('items') or {}
          ok=sum(1 for v in items.values() if isinstance(v,dict) and (v.get('zh') or v.get('en')))
          sys.exit(0 if ok>0 else 1)"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "ALREADY_DONE audio/$D/manifest.json"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成今日音频
        if: steps.chk.outputs.done == 'false'
        run: python tools/gen_audio.py "${{ steps.dt.outputs.today }}"

      - name: 提交并推送
        if: steps.chk.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "NO_CHANGES_SKIP"
          else
            git commit -m "Daily podcast audio: ${{ steps.dt.outputs.today }}"
            git push origin HEAD:main
            echo "PUSH_OK"
          fi
